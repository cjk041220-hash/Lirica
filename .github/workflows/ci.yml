# 最小 CI（2026-08-08 体检 A2）：后端 pytest + ruff，前端 vitest + oxlint
# + prettier，外加 SW 版本发版检查。playwright e2e 需起后端服务，暂不进 CI。
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
      - name: ruff
        working-directory: backend
        run: ruff check .
      - name: SW 版本发版检查
        run: python scripts/check_sw_version.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
