# ruff 最小规则集（2026-08-08 体检 A3）：先求「能进 CI 的存量零违规」，
# 规则扩展留给后续轮次评审。
target-version = "py312"
line-length = 100

[lint]
# E=pycodestyle 错误, W=pycodestyle 警告, F=pyflakes, I=isort
# E501（行超长）交给后续与 formatter 一起评——存量长注释/文档串较多；
# E402（模块中部 import）是项目惯用写法（log 初始化后再补 import），不动
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[lint.per-file-ignores]
# heartbeat.py 模块头注释声明的再导出契约（from heartbeat import … 与
# heartbeat.X 直读，tests/test_heartbeat.py 依赖），F401 是误报
"heartbeat.py" = ["F401"]
# tools/__init__.py 是工具层装配出口，import 即再导出
"tools/__init__.py" = ["F401"]

[lint.isort]
# 项目惯例：标准库 → 第三方 → 本地（database/ memory/ utils/ 等平铺包）
known-first-party = ["agent", "api", "config", "database", "memory", "providers", "tools", "utils", "heartbeat", "heartbeat_moods", "main", "version"]
