<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2789F" />
    <!-- 展示体「站酷快乐体」：unicode-range 分片，只下载标题用到的字形；
         display=swap 系统字先行；离线时整条链路静默失败回落圆体系统栈 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小汐的房间" />
    <link rel="manifest" href="/manifest.json" />
    <!-- 预取聊天高频立绘链（listening→thinking→speaking→happy），弱网切状态不闪旧图；idle/sleeping 由首帧正常加载不重复预取 -->
    <link rel="preload" as="image" href="/sprites/listening.webp" />
    <link rel="preload" as="image" href="/sprites/thinking.webp" />
    <link rel="preload" as="image" href="/sprites/speaking.webp" />
    <link rel="preload" as="image" href="/sprites/happy.webp" />
    <title>小汐的房间</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
