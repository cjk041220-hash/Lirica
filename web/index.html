<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS 主屏幕图标用专用 180×180（Apple 文档尺寸；192 会被降采样发虚）。
         不透明满铺方图——iOS 自裁超椭圆圆角，透明边在深色壁纸上出白边 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2789F" />
    <!-- 展示体「站酷快乐体」已自托管（fontsource 分片包，main.jsx 引入）：
         不再外链 Google Fonts——隐私陪伴应用不该每次加载送出访客 IP，
         且同源字体可进 SW 缓存，离线时展示体照常工作 -->
    <!-- 标准版 + Apple 私有版成对声明：Edge headless 对仅 apple- 版本报
         "is deprecated" 弃用警告，标准版（mobile-web-app-capable）消除之 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent：standalone PWA 下状态栏透明、房间天空透到刘海后，
         页面内容上移——顶栏胶囊已叠 env(safe-area-inset-top) 避让（App.jsx）。
         仅「添加到主屏幕」后生效，浏览器内访问不受影响 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="小汐的房间" />
    <link rel="manifest" href="/manifest.json" />
    <!-- 预取聊天高频立绘链（listening→thinking→speaking→happy），弱网切状态不闪旧图；idle/sleeping 由首帧正常加载不重复预取 -->
    <link rel="preload" as="image" href="/sprites/listening.webp" />
    <link rel="preload" as="image" href="/sprites/thinking.webp" />
    <link rel="preload" as="image" href="/sprites/speaking.webp" />
    <link rel="preload" as="image" href="/sprites/happy.webp" />
    <title>小汐的房间</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
