services:
  xiaoxi:
    build: .
    container_name: xiaoxi
    restart: unless-stopped
    ports:
      # 默认只绑定回环地址，防止无认证暴露公网。
      # 局域网/公网访问请前置 Nginx/Caddy 等反向代理并配置认证，
      # 或确认已设置 XIAOXI_API_TOKEN 后再改为 "8000:8000"。
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/config/.env
    volumes:
      - xiaoxi-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  xiaoxi-data:
