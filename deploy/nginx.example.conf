# 小汐 反向代理示例（Nginx：需自备证书，或用 certbot 申请）。
# 把 server_name 与 ssl_certificate 路径换成你的。前置 Nginx 后，
# docker-compose 的端口保持 127.0.0.1:8000。
server {
    listen 443 ssl;
    http2 on;
    server_name xiaoxi.example.com;

    ssl_certificate     /etc/letsencrypt/live/xiaoxi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoxi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需：关闭代理缓冲，否则流式回复会被攒成一坨
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}

# 重要：启用 Nginx 后，若希望限流按真实客户端 IP 计数，需在 backend/config/.env
# 设 TRUST_PROXY=true（限流才会取 X-Forwarded-For 的最右值）；否则所有用户会被
# 算成反代自身的 IP，限流形同虚设或误伤。直连（无反代）时务必保持 TRUST_PROXY=false。
